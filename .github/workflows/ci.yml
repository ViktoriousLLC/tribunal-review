name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Install dependencies
        run: npm ci --ignore-scripts
        working-directory: tribunal/scripts
      - name: Test scripts
        run: node --test
        working-directory: tribunal/scripts
      - name: Test hooks
        run: node --test
        working-directory: tribunal/hooks
      - name: Run goal-wall negative control
        run: node --test goal-wall.negative-control.cjs
        working-directory: tribunal/hooks
      - name: Run no-telemetry negative controls
        run: node noTelemetry.negative-control.mjs
        working-directory: tribunal/scripts
